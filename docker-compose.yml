# Training Copilot: n8n + Postgres, local only.
# Ports bind to 127.0.0.1 so nothing is reachable from the network.
# All secrets come from .env (git-ignored); see .env.example.

name: training-copilot

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Read by sql/00_init.sh on first start only
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      COPILOT_WRITER_PASSWORD: ${COPILOT_WRITER_PASSWORD}
      COPILOT_READER_PASSWORD: ${COPILOT_READER_PASSWORD}
      TZ: Europe/Lisbon
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./sql/01_schema.sql:/sql/01_schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # n8n's own state lives in its own database, separate from run logs
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Data governance: execution payloads contain health data, keep them short-lived
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168 # hours
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_SAVE_ON_SUCCESS:-all} # set "none" once stable
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /data # file nodes can read nothing else
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  pg_data:
  n8n_data:
